<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NotebookLM Concurrency Unlocker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 330px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-title {
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .version-tag {
      font-size: 10px;
      background: #334155;
      color: #94a3b8;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lang-toggle-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .lang-toggle-btn:hover {
      background: #38bdf8;
      color: #0f172a;
    }
    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
    }
    .status-dot.inactive {
      background: #94a3b8;
      box-shadow: none;
    }
    .status-label {
      font-size: 12px;
      color: #cbd5e1;
    }
    .control-group {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .control-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .control-title {
      font-size: 12px;
      color: #e2e8f0;
      font-weight: 500;
    }
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .slider {
      accent-color: #38bdf8;
      cursor: pointer;
      width: 90px;
    }
    .val-badge {
      background: #38bdf8;
      color: #0f172a;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 9999px;
      min-width: 18px;
      text-align: center;
    }
    /* Mode Selector */
    .mode-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }
    .mode-opt {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: rgba(15, 23, 42, 0.6);
      cursor: pointer;
      font-size: 11px;
      color: #cbd5e1;
      transition: all 0.15s;
    }
    .mode-opt.selected {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      color: #f1f5f9;
      font-weight: 600;
    }
    .mode-opt input {
      accent-color: #38bdf8;
      cursor: pointer;
    }
    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-round {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .2s;
      border-radius: 20px;
    }
    .slider-round:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider-round {
      background-color: #0284c7;
    }
    input:checked + .slider-round:before {
      transform: translateX(18px);
    }
    .btn-open {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      padding: 9px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s;
    }
    .btn-open:hover {
      filter: brightness(1.1);
    }
    .telemetry-row {
      display: flex;
      justify-content: space-around;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 10px;
      text-align: center;
    }
    .telemetry-val {
      font-weight: 600;
      color: #f1f5f9;
      font-size: 12px;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <span class="header-title" id="pop-header-title">⚡ NotebookLM Unlocker</span>
      <span class="version-tag">v1.1.0</span>
    </div>
    <div class="header-actions">
      <button class="lang-toggle-btn" id="pop-lang-toggle">中文</button>
    </div>
  </div>

  <div class="status-card">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-label" id="status-label">Detecting active tab...</span>
    </div>
  </div>

  <div class="control-group">
    <!-- Dispatch Mode -->
    <div class="control-col">
      <span class="control-title" id="pop-mode-title">Dispatch Mode:</span>
      <div class="mode-options">
        <label class="mode-opt selected" id="pop-opt-parallel">
          <input type="radio" name="pop-dispatch-mode" value="parallel" checked />
          <span id="pop-mode-parallel-text">⚡ Simultaneous Parallel Stream</span>
        </label>
        <label class="mode-opt" id="pop-opt-serial">
          <input type="radio" name="pop-dispatch-mode" value="serial" />
          <span id="pop-mode-serial-text">⏳ Serial Native Queue</span>
        </label>
      </div>
    </div>

    <!-- Workers Slider -->
    <div class="control-row">
      <span class="control-title" id="pop-workers-title">Concurrency Workers</span>
      <div class="slider-wrap">
        <input type="range" class="slider" id="pop-workers-slider" min="1" max="7" value="5" />
        <span class="val-badge" id="pop-workers-val">5</span>
      </div>
    </div>

    <!-- Unfreeze Switch -->
    <div class="control-row">
      <span class="control-title" id="pop-unfreeze-title">Force Unlock Input Box</span>
      <label class="switch">
        <input type="checkbox" id="pop-unfreeze-switch" checked />
        <span class="slider-round"></span>
      </label>
    </div>

    <!-- Auto Queue / Intercept Switch -->
    <div class="control-row">
      <span class="control-title" id="pop-auto-queue-title">Native Intercept / Queue</span>
      <label class="switch">
        <input type="checkbox" id="pop-auto-queue-switch" checked />
        <span class="slider-round"></span>
      </label>
    </div>

    <!-- Floating Button Switch -->
    <div class="control-row">
      <span class="control-title" id="pop-show-float-title">Show Floating Button</span>
      <label class="switch">
        <input type="checkbox" id="pop-show-float-switch" checked />
        <span class="slider-round"></span>
      </label>
    </div>
  </div>

  <button class="btn-open" id="btn-open-notebook">Open / Switch to NotebookLM</button>

  <div class="telemetry-row">
    <div>
      <div id="pop-tel-total-label">Total Queries</div>
      <div class="telemetry-val" id="pop-total-queries">0</div>
    </div>
    <div>
      <div id="pop-tel-rate-label">Success Rate</div>
      <div class="telemetry-val" id="pop-success-rate">100%</div>
    </div>
    <div>
      <div id="pop-tel-time-label">Avg Duration</div>
      <div class="telemetry-val" id="pop-avg-time">0.0s</div>
    </div>
  </div>

  <script src="lib/i18n.js"></script>
  <script src="lib/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
